<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GTermBox Web Terminal</title>

  <link rel="stylesheet" href="lib/xterm.css" />

  <style>

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }

    body {

      background-color: #0b0f19;

      color: #e2e8f0;

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      display: flex;

      flex-direction: column;

      height: 100vh;

      overflow: hidden;

    }

    header {

      background: #1e293b;

      padding: 8px 16px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom: 1px solid #334155;

      flex-shrink: 0;

      gap: 12px;

    }

    .title {

      font-weight: 600;

      font-size: 15px;

      letter-spacing: 0.5px;

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .badge {

      font-size: 11px;

      background: #0284c7;

      color: #ffffff;

      padding: 2px 6px;

      border-radius: 4px;

      text-transform: uppercase;

      font-weight: 700;

    }

    .subtitle {

      font-size: 12px;

      color: #94a3b8;

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .header-btn {

      background: #0f172a;

      color: #e2e8f0;

      border: 1px solid #334155;

      border-radius: 6px;

      padding: 5px 10px;

      font-size: 12px;

      cursor: pointer;

      font-weight: 500;

      display: flex;

      align-items: center;

      gap: 5px;

      transition: all 0.15s ease;

    }

    .header-btn:hover {

      background: #1e293b;

      border-color: #64748b;

      color: #38bdf8;

    }

    #tabs-bar {

      background: #0f172a;

      display: flex;

      align-items: center;

      border-bottom: 1px solid #1e293b;

      padding: 4px 8px 0 8px;

      overflow-x: auto;

      gap: 4px;

      flex-shrink: 0;

    }

    .tab {

      display: flex;

      align-items: center;

      gap: 8px;

      background: #1e293b;

      color: #94a3b8;

      padding: 6px 14px;

      font-size: 12px;

      font-weight: 500;

      border-top-left-radius: 6px;

      border-top-right-radius: 6px;

      cursor: pointer;

      user-select: none;

      border: 1px solid #334155;

      border-bottom: none;

      transition: all 0.15s ease;

      white-space: nowrap;

    }

    .tab:hover {

      background: #273549;

      color: #f8fafc;

    }

    .tab.active {

      background: #0c0c0c;

      color: #38bdf8;

      border-color: #0284c7;

      border-bottom: 1px solid #0c0c0c;

      font-weight: 600;

    }

    .tab-close {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      width: 16px;

      height: 16px;

      border-radius: 50%;

      font-size: 13px;

      line-height: 1;

      color: #94a3b8;

      transition: all 0.15s ease;

    }

    .tab-close:hover {

      background: #ef4444;

      color: #ffffff;

    }

    #new-tab-btn {

      background: transparent;

      border: 1px dashed #475569;

      color: #94a3b8;

      border-radius: 6px;

      padding: 4px 10px;

      font-size: 14px;

      line-height: 1;

      cursor: pointer;

      margin-left: 4px;

      margin-bottom: 2px;

      transition: all 0.15s ease;

    }

    #new-tab-btn:hover {

      background: #1e293b;

      color: #38bdf8;

      border-color: #0284c7;

    }

    #terminal-wrapper {

      flex: 1;

      width: 100%;

      height: 100%;

      background: #0c0c0c;

      overflow: hidden;

      position: relative;

    }

    .tab-pane {

      width: 100%;

      height: 100%;

      padding: 4px;

      position: absolute;

      inset: 0;

      display: none;

    }

    .tab-pane.active {

      display: block;

    }

    .xterm {

      width: 100%;

      height: 100%;

    }

    .xterm-viewport {

      overflow-y: auto;

    }

    .xterm .xterm-cursor.xterm-cursor-outline {

      outline: none !important;

      box-shadow: inset 0 0 0 1px #ffffff !important;

    }

    #toast-container {

      position: fixed;

      bottom: 20px;

      right: 20px;

      display: flex;

      flex-direction: column;

      gap: 8px;

      z-index: 9999;

      pointer-events: none;

    }

    .toast {

      background: #1e293b;

      border: 1px solid #334155;

      color: #f8fafc;

      font-size: 13px;

      padding: 10px 16px;

      border-radius: 8px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);

      animation: fadeIn 0.2s ease;

      display: flex;

      align-items: center;

      gap: 8px;

    }

    .toast.success {

      border-left: 4px solid #10b981;

    }

    .toast.error {

      border-left: 4px solid #ef4444;

    }

    .toast.warning {

      border-left: 4px solid #f59e0b;

    }

    @keyframes fadeIn {

      from { opacity: 0; transform: translateY(10px); }

      to { opacity: 1; transform: translateY(0); }

    }

    .modal-overlay {

      position: fixed;

      inset: 0;

      background: rgba(11, 15, 25, 0.85);

      backdrop-filter: blur(8px);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 999;

    }

    .modal-content {

      background: #1e293b;

      border: 1px solid #334155;

      border-radius: 12px;

      padding: 24px;

      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);

      display: flex;

      flex-direction: column;

      gap: 16px;

      max-height: 85vh;

      overflow-y: auto;

    }

    .sessions-table {

      width: 100%;

      border-collapse: collapse;

      font-size: 13px;

      text-align: left;

    }

    .sessions-table th {

      background: #0f172a;

      color: #94a3b8;

      padding: 8px 12px;

      border-bottom: 1px solid #334155;

    }

    .sessions-table td {

      padding: 8px 12px;

      border-bottom: 1px solid #273549;

      color: #e2e8f0;

    }

    .sessions-table tr:hover td {

      background: #273549;

    }

    .kill-btn {

      background: #ef4444;

      color: #ffffff;

      border: none;

      border-radius: 4px;

      padding: 3px 8px;

      font-size: 11px;

      cursor: pointer;

      font-weight: 600;

    }

    .kill-btn:hover {

      background: #dc2626;

    }


    .special-tab-btn {
      background: #0284c7;
      color: #ffffff;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-right: 6px;
      transition: background 0.15s ease;
    }
    .special-tab-btn:hover {
      background: #0369a1;
    }
    .tab.files-tab {
      background: #0369a1;
      border-color: #38bdf8;
      color: #f0f9ff;
    }
    .tab.files-tab.active {
      background: #0284c7;
      border-color: #7dd3fc;
      color: #ffffff;
    }
    .files-pane {
      display: none;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      background: #0f172a;
      overflow: hidden;
    }
    .files-pane.active {
      display: flex;
      flex-direction: column;
    }
    .files-panel-wrapper {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    .files-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      gap: 12px;
    }
    .files-path-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: monospace;
      font-size: 13px;
      color: #e2e8f0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .files-path-label {
      color: #94a3b8;
      font-weight: 600;
    }
    .files-path-current {
      color: #38bdf8;
      font-weight: 600;
    }
    .files-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .files-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .files-btn:hover:not(:disabled) {
      background: #475569;
    }
    .files-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .files-btn.files-upload-btn {
      background: #0284c7;
      border-color: #38bdf8;
    }
    .files-btn.files-upload-btn:hover {
      background: #0369a1;
    }
    .files-table-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0;
      background: #0b0f19;
    }
    .files-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }
    .files-table thead {
      position: sticky;
      top: 0;
      background: #1e293b;
      z-index: 10;
    }
    .files-table th {
      padding: 10px 16px;
      color: #94a3b8;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #334155;
    }
    .files-table td {
      padding: 10px 16px;
      border-bottom: 1px solid #1e293b;
      color: #f1f5f9;
    }
    .files-table tbody tr {
      transition: background 0.1s ease;
    }
    .files-table tbody tr:hover {
      background: #1e293b;
    }
    .file-name-link {
      cursor: pointer;
      color: #38bdf8;
      text-decoration: none;
    }
    .file-name-link:hover {
      text-decoration: underline;
    }
    .file-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: background 0.15s ease;
    }
    .file-action-btn:hover {
      background: #334155;
    }
  </style>

  <script src="lib/xterm.js"></script>

  <script src="lib/addon-fit.js"></script>

</head>

<body>

  <div id="login-overlay" style="position:fixed; inset:0; background:rgba(11,15,25,0.85); backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; z-index:9999;">

    <div style="background:#1e293b; border:1px solid #334155; border-radius:12px; padding:32px; width:360px; box-shadow:0 20px 40px rgba(0,0,0,0.6); display:flex; flex-direction:column; gap:20px;">

      <div style="text-align:center;">

        <h2 style="font-size:20px; font-weight:700; color:#f8fafc; margin-bottom:6px;">GTermBox Login</h2>

        <p style="font-size:13px; color:#94a3b8;">Enter credentials to enter your sandbox</p>

        <div id="login-error" style="display:none; background:rgba(239,68,68,0.15); border:1px solid #ef4444; color:#fca5a5; font-size:12px; padding:8px 12px; border-radius:6px; text-align:center;"></div>

  <div id="toast-container"></div>
  <div id="upload-progress-overlay" style="display:none; position:fixed; bottom:24px; right:24px; z-index:9999; width:360px; background:#1e293b; border:1px solid #3b82f6; border-radius:8px; padding:12px 16px; box-shadow:0 10px 25px rgba(0,0,0,0.5); font-family:inherit;">

      <div id="upload-progress-bar" style="width:0%; height:100%; background:linear-gradient(90deg, #38bdf8, #2563eb); transition:width 0.15s ease;"></div>
    </div>
    <div id="upload-status-details" style="font-size:11px; color:#94a3b8; margin-top:4px;">0 MB / 0 MB</div>
  </div>



  <script>

(function(window, document) {

  'use strict';



  function showToast(message, type) {

    const container = document.getElementById('toast-container');

    if (!container) return;

    const toast = document.createElement('div');

    toast.className = 'toast ' + (type || 'success');

    toast.textContent = message;

    container.appendChild(toast);

    setTimeout(() => {

      toast.style.opacity = '0';

      toast.style.transition = 'opacity 0.3s ease';

      setTimeout(() => toast.remove(), 300);

    }, 3500);

  }

  window.showToast = showToast;



  class GTermBox {

    constructor(containerElement, appName) {

      this.container = containerElement;

      this.appName = appName || 'testapp';

      this.container.innerHTML = '';



      this.term = new Terminal({

        cursorBlink: false,

        cursorStyle: 'block',

        cursorWidth: 2,

        cursorInactiveStyle: 'block',

        fontFamily: '"Cascadia Code", "Consolas", "Courier New", monospace',

        fontSize: 15,

        letterSpacing: 0,

        lineHeight: 1.0,

        theme: {

          background: '#0c0c0c',

          foreground: '#cccccc',

          cursor: '#ffffff',

          cursorAccent: '#000000',

          selectionBackground: 'rgba(255, 255, 255, 0.3)'

        },

        allowProposedApi: true

      });



      this.fitAddon = new FitAddon.FitAddon();

      this.term.loadAddon(this.fitAddon);

      this.term.open(this.container);



      try {

        this.fitAddon.fit();

      } catch (_) {}



      try {

        this.term.focus();

      } catch (_) {}



      this.transportMode = 'unknown';

      this.wt = null;

      this.wtBidiStream = null;

      this.wtWriter = null;

      this.wtReader = null;

      this.isDestroyed = false;



      this.initListeners();

      this.connect();

    }



    initListeners() {

      this.container.addEventListener('click', () => {

        if (this.term) {

          try {

            this.term.focus();

          } catch (_) {}

        }

      });



      this.term.attachCustomKeyEventHandler((e) => {

        if (e.type === 'keydown') {

          if (e.ctrlKey && !e.altKey && !e.shiftKey) {

            const key = e.key.toLowerCase();

            if (key === 'o' || key === 's' || key === 'p') {

              e.preventDefault();

              const code = key === 'o' ? '\x0f' : (key === 's' ? '\x13' : '\x10');

              this.sendInput(code);

              return false;

            }

          }

        }

        return true;

      });



      this.term.onData((data) => {

        this.sendInput(data);

      });



      this.term.onResize(({ cols, rows }) => {

        this.send({ type: 'resize', cols, rows });

      });



      this.term.onSelectionChange(() => {

        const selection = this.term.getSelection();

        if (selection && selection.length > 0 && navigator.clipboard && navigator.clipboard.writeText) {

          navigator.clipboard.writeText(selection).catch(() => {});

        }

      });



      this.windowResizeHandler = () => {

        if (this.isDestroyed) return;

        try {

          this.fitAddon.fit();

        } catch (_) {}

      };

      window.addEventListener('resize', this.windowResizeHandler);

    }



    async connect() {

      if (this.isDestroyed) return;

      this.updateBadge('Connecting', '#0284c7');



      if (window.WebTransport) {

        const ok = await this.connectWebTransport();

        if (ok) return;

      }



      this.handleDisconnect('Connection lost.');

    }



    async connectWebTransport() {

      try {

        let wtOptions = undefined;

        try {

          const res = await fetch('/api/certificate-hash');

          if (res.ok) {

            const data = await res.json();

            if (data && data.hash && Array.isArray(data.hash) && data.hash.length === 32) {

              wtOptions = {

                serverCertificateHashes: [{ algorithm: 'sha-256', value: new Uint8Array(data.hash) }]

              };

            }

          }

        } catch (_) {}



        const token = sessionStorage.getItem('gtermbox_token') || '';

        if (!token) {

          this.handleDisconnect('Please sign in.');

          return false;

        }

        let sessionId = '';

        try {

          const sRes = await fetch('/api/terminal/session', {

            method: 'POST',

            headers: {

              'Content-Type': 'application/json',

              'Authorization': 'Bearer ' + token

            },

            body: JSON.stringify({ app: this.appName, cols: this.term.cols || 120, rows: this.term.rows || 30 })

          });

          if (sRes.status === 401) {
            sessionStorage.removeItem('gtermbox_token');
            sessionStorage.removeItem('gtermbox_user');
            sessionStorage.removeItem('gtermbox_sandbox');
            if (typeof window.showLoginGlobal === 'function') {
              window.showLoginGlobal('Invalid or expired token. Please sign in again.');
            }
            return false;
          }
          if (sRes.status === 422) {
            const sData = await sRes.json().catch(() => ({}));
            const errMsg = sData.error || 'Application is not available on this server.';
            showToast(errMsg, 'warning');
            if (typeof this.onLaunchFailed === 'function') {
              this.onLaunchFailed(errMsg);
            }
            this.destroy();
            return false;
          }
          if (sRes.ok) {
            const sData = await sRes.json();
            sessionId = sData.sessionId || '';
          } else {
            const sData = await sRes.json().catch(() => ({}));
            const errMsg = sData.error || 'Failed to start session.';
            showToast(errMsg, 'error');
            if (typeof this.onLaunchFailed === 'function') {
              this.onLaunchFailed(errMsg);
            }
            this.destroy();
            return false;
          }

        } catch (_) {}



        let wtUrl = `https://${window.location.host}/wt/terminal?cols=${this.term.cols || 120}&rows=${this.term.rows || 30}&token=${encodeURIComponent(token)}`;

        if (sessionId) {

          wtUrl += `&session=${encodeURIComponent(sessionId)}`;

        } else {

          wtUrl += `&app=${encodeURIComponent(this.appName)}`;

        }



        this.wt = wtOptions ? new WebTransport(wtUrl, wtOptions) : new WebTransport(wtUrl);

        await this.wt.ready;



        this.wtBidiStream = await this.wt.createBidirectionalStream();

        this.wtWriter = this.wtBidiStream.writable.getWriter();

        this.wtReader = this.wtBidiStream.readable.getReader();

        this.transportMode = 'webtransport';



        this.updateBadge('WebTransport', '#10b981');

        try {

          this.term.focus();

        } catch (_) {}



        this.readWebTransportStream();

        this.send({ type: 'init', app: this.appName, cols: this.term.cols, rows: this.term.rows });



        this.wt.closed.then(() => {

          if (!this.isDestroyed) {

            this.handleDisconnect('Disconnected from server.');

          }

        }).catch(() => {

          if (!this.isDestroyed) {

            this.handleDisconnect('Disconnected from server.');

          }

        });



        return true;

      } catch (err) {

        if (this.wt) {

          try { this.wt.close(); } catch (_) {}

          this.wt = null;

        }

        this.handleDisconnect('WebTransport connection failed (TLS certificate error or server unreachable).', 'transport_failed');

        return false;

      }

    }



    async readWebTransportStream() {

      try {

        while (!this.isDestroyed && this.wtReader) {

          const { value, done } = await this.wtReader.read();

          if (done) break;

          if (value && value.length > 0) {

            if (value[0] === 123) {

              const str = new TextDecoder().decode(value);

              if (str.includes('"type":"logout"')) {

                let reason = 'Session ended.';

                try {

                  const msg = JSON.parse(str.trim());

                  if (msg.reason === 'idle_timeout') {

                    reason = 'Logged out due to inactivity.';

                  } else if (msg.reason === 'terminated') {

                    reason = 'Session terminated.';

                  } else if (msg.reason === 'process_failed') {

                    reason = 'Application executable not found or failed to launch.';

                  }

                } catch (_) {

                  if (str.includes('idle_timeout')) {

                    reason = 'Logged out due to inactivity.';

                  } else if (str.includes('terminated')) {

                    reason = 'Session terminated.';

                  }

                }

                this.handleDisconnect(reason);

                return;

              }

              if (str.includes('"type":"app_error"')) {

                this.updateBadge('App Unavailable', '#f59e0b');

                continue;

              }

              if (str.includes('"type":"output"')) {

                try {

                  const msg = JSON.parse(str.trim());

                  if (msg.data) {

                    this.term.write(msg.data);

                    continue;

                  }

                } catch (_) {}

              }

            }

            this.term.write(value);

          }

        }

      } catch (_) {

      } finally {

        if (!this.isDestroyed) {

          this.handleDisconnect('Disconnected from server.');

        }

      }

    }



    sendInput(data) {

      if (this.isDestroyed || !this.wtWriter) return;

      let payload;

      if (typeof data === 'string') {

        payload = new TextEncoder().encode(data);

      } else {

        payload = data;

      }

      this.wtWriter.write(payload).catch(() => {});

    }



    send(msgObj) {

      const jsonStr = JSON.stringify(msgObj) + '\n';

      this.sendInput(jsonStr);

    }



    updateBadge(text, color) {
      if (window.tabManager && window.tabManager.activeTabId) {
        const activeTab = window.tabManager.tabs.find(t => t.id === window.tabManager.activeTabId);
        if (activeTab && activeTab.instance !== this) {
          return;
        }
      }
      const badge = document.getElementById('transport-badge');
      if (badge) {
        badge.textContent = text;
        badge.style.background = color;
      }
    }



    handleDisconnect(reason, category = 'disconnected') {

      if (this.isDisconnecting) return;

      this.isDisconnecting = true;

      const msg = reason || 'Disconnected from server.';

      let badgeText = 'Disconnected';
      let badgeColor = '#64748b';
      let statusDesc = 'Session disconnected or process exited.';
      if (category === 'app_unavailable') {
        badgeText = 'App Unavailable';
        badgeColor = '#f59e0b';
        statusDesc = 'Application executable not found or process exited.';
      } else if (category === 'transport_failed') {
        badgeText = 'Connection Failed';
        badgeColor = '#ef4444';
        statusDesc = 'WebTransport connection failed (TLS certificate untrusted, expired, or server unreachable).';
      }
      this.updateBadge(badgeText, badgeColor);

      if (this.term) {

        try {

          this.term.writeln('');

          this.term.writeln('\x1b[1;31m================================================================================\x1b[0m');

          this.term.writeln('\x1b[1;31m [GTermBox Error] ' + msg + '\x1b[0m');

          this.term.writeln('\x1b[1;31m================================================================================\x1b[0m');

          this.term.writeln('\x1b[1;33mApplication:\x1b[0m   ' + this.appName);

          this.term.writeln('\x1b[1;36mStatus:\x1b[0m        ' + statusDesc);

          this.term.writeln('');

          this.term.writeln('\x1b[1;32mHow to proceed:\x1b[0m');

          this.term.writeln('  1. Select an available application (e.g. \x1b[1;37mPowerShell\x1b[0m) from the \x1b[1;37mApplication:\x1b[0m dropdown above.');

          this.term.writeln('  2. Or click the \x1b[1;37m[+]\x1b[0m button to open a new tab.');

          this.term.writeln('');

        } catch (_) {}

      }

      this.destroy(false);

    }



    destroy(clearDom = true) {

      this.isDestroyed = true;

      if (this.windowResizeHandler) {

        window.removeEventListener('resize', this.windowResizeHandler);

        this.windowResizeHandler = null;

      }

      if (this.wtReader) {

        try { this.wtReader.cancel(); } catch (_) {}

        try { this.wtReader.releaseLock(); } catch (_) {}

        this.wtReader = null;

      }

      if (this.wtWriter) {

        try { this.wtWriter.close().catch(() => {}); } catch (_) {}

        try { this.wtWriter.releaseLock(); } catch (_) {}

        this.wtWriter = null;

      }

      if (this.wt) {

        try { this.wt.close(); } catch (_) {}

        this.wt = null;

      }

      if (clearDom) {

        if (this.term) {

          try { this.term.dispose(); } catch (_) {}

          this.term = null;

        }

        if (this.container) {

          this.container.innerHTML = '';

        }

      }

    }

  }



    function uploadSingleFile(file, token, subPath = '', scope = 'home') {
      return new Promise((resolve, reject) => {
        const canUpload = sessionStorage.getItem('gtermbox_upload') !== 'false';
        if (!canUpload) {
          showToast('Upload permission denied for your account', 'error');
          return reject(new Error('Upload permission denied'));
        }

        const overlay = document.getElementById('upload-progress-overlay');
        const bar = document.getElementById('upload-progress-bar');
        const text = document.getElementById('upload-percent-text');
        const nameEl = document.getElementById('upload-file-name');
        const detailsEl = document.getElementById('upload-status-details');

        if (overlay) {
          overlay.style.display = 'block';
          if (nameEl) nameEl.textContent = file.name;
          if (bar) bar.style.width = '0%';
          if (text) text.textContent = '0%';
          if (detailsEl) detailsEl.textContent = '0 MB / ' + (file.size / (1024 * 1024)).toFixed(2) + ' MB (0%)';
        }

        let uploadUrl = `/api/sandbox/file?name=${encodeURIComponent(file.name)}&scope=${encodeURIComponent(scope || 'home')}`;
        if (subPath) {
          uploadUrl += `&path=${encodeURIComponent(subPath)}`;
        }
        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl, true);
        xhr.setRequestHeader('Authorization', 'Bearer ' + token);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');

        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable && overlay) {
            const percent = Math.min(100, Math.round((event.loaded / event.total) * 100));
            const loadedMB = (event.loaded / (1024 * 1024)).toFixed(2);
            const totalMB = (event.total / (1024 * 1024)).toFixed(2);
            if (bar) bar.style.width = percent + '%';
            if (text) text.textContent = percent + '%';
            if (detailsEl) detailsEl.textContent = `${loadedMB} MB / ${totalMB} MB (${percent}%)`;
          }
        };

        xhr.onload = () => {
          if (xhr.status === 200) {
            if (bar) bar.style.width = '100%';
            if (text) text.textContent = '100%';
            showToast(`Uploaded ${file.name} successfully to sandbox!`, 'success');
            setTimeout(() => { if (overlay) overlay.style.display = 'none'; }, 1200);
            resolve(xhr.response);
          } else if (xhr.status === 401) {
            if (overlay) overlay.style.display = 'none';
            sessionStorage.removeItem('gtermbox_token');
            sessionStorage.removeItem('gtermbox_user');
            sessionStorage.removeItem('gtermbox_sandbox');
            sessionStorage.removeItem('gtermbox_upload');
            sessionStorage.removeItem('gtermbox_download');
            showLoginGlobal('Session expired. Please sign in again.');
            reject(new Error('Unauthorized'));
          } else if (xhr.status === 403) {
            if (overlay) overlay.style.display = 'none';
            showToast(`Upload failed for ${file.name}: Upload permission denied`, 'error');
            reject(new Error('Upload permission denied'));
          } else if (xhr.status === 413) {
            if (overlay) overlay.style.display = 'none';
            showToast(`Upload failed for ${file.name}: File too large (max 1 GB)`, 'error');
            reject(new Error('File too large'));
          } else {
            if (overlay) overlay.style.display = 'none';
            let errMsg = xhr.statusText;
            try {
              const errObj = JSON.parse(xhr.responseText);
              if (errObj && errObj.error) errMsg = errObj.error;
            } catch (e) {}
            showToast(`Upload failed for ${file.name}: ${errMsg}`, 'error');
            reject(new Error(errMsg));
          }
        };

        xhr.onerror = () => {
          if (overlay) overlay.style.display = 'none';
          showToast(`Upload network error for ${file.name}`, 'error');
          reject(new Error('Network error'));
        };

        xhr.send(file);
      });
    }



class FileManagerPanel {

    formatSize(bytes) {
      if (bytes === undefined || bytes === null || bytes < 0) return '—';
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    formatDate(isoStr) {
      if (!isoStr) return '—';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.getFullYear() + '-' +
          String(d.getMonth() + 1).padStart(2, '0') + '-' +
          String(d.getDate()).padStart(2, '0') + ' ' +
          String(d.getHours()).padStart(2, '0') + ':' +
          String(d.getMinutes()).padStart(2, '0');
      } catch (_) {
        return isoStr;
      }
    }

    formatDisplayPath() {
      const isAdmin = sessionStorage.getItem('gtermbox_role') === 'admin';
      if (isAdmin) {
        if (this.isDrivesRoot) return 'Drives:\\';
        if (this.currentFullPath) return this.currentFullPath;
      }
      const prefix = (this.currentScope === 'server') ? 'server:\\' : 'home:\\';
      return this.currentPath ? prefix + this.currentPath.replace(/\//g, '\\') : prefix;
    }

    async loadDirectory(subPath = '', scope = null) {
      const isAdmin = sessionStorage.getItem('gtermbox_role') === 'admin';
      if (scope !== null) {
        this.currentScope = scope;
      } else if (!this.currentScope) {
        this.currentScope = isAdmin ? 'drives' : 'home';
      }

      const raw = (subPath || '').replace(/\\+/g, '/').replace(/^\/+|\/+$/g, '');
      if (raw === '..' && this.currentScope === 'home' && isAdmin) {
        this.currentScope = 'server';
        this.currentPath = '';
      } else if (raw.startsWith('../') && this.currentScope === 'home' && isAdmin) {
        this.currentScope = 'server';
        this.currentPath = raw.substring(3);
      } else {
        this.currentPath = (subPath || '').trim();
      }

      const displayPath = this.formatDisplayPath();
      if (this.pathDisplay) {
        this.pathDisplay.textContent = displayPath;
        if (isAdmin) {
          this.pathDisplay.style.cursor = 'pointer';
          this.pathDisplay.title = 'Click to jump to directory on disk';
          this.pathDisplay.onclick = () => {
            const target = prompt('Jump to directory on server disk:', this.currentFullPath || 'C:\\');
            if (target && target.trim()) {
              this.loadDirectory(target.trim(), 'server');
            }
          };
        }
      }
      if (this.upBtn) {
        if (isAdmin) {
          this.upBtn.disabled = !!this.isDrivesRoot;
        } else {
          this.upBtn.disabled = !this.currentPath;
        }
      }

      const token = sessionStorage.getItem('gtermbox_token') || '';
      if (!token) {
        if (window.showLoginGlobal) window.showLoginGlobal('Please sign in to view sandbox files');
        return;
      }

      this.tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding:24px;">Loading directory items...</td></tr>';

      try {
        let query = `?scope=${encodeURIComponent(this.currentScope)}`;
        if (this.currentPath) {
          query += `&path=${encodeURIComponent(this.currentPath)}`;
        }
        const resp = await fetch('/api/sandbox/files' + query, {
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (resp.status === 401) {
          if (window.showLoginGlobal) window.showLoginGlobal('Session expired. Please sign in again.');
          return;
        }

        if (resp.status === 403) {
          showToast('Access denied to requested path', 'error');
          this.tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444; padding:24px;">Access forbidden.</td></tr>';
          return;
        }

        if (!resp.ok) {
          const errObj = await resp.json().catch(() => ({}));
          const errMsg = errObj.error || resp.statusText;
          showToast('Error loading directory: ' + errMsg, 'error');
          this.tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444; padding:24px;">' + errMsg + '</td></tr>';
          return;
        }

        const data = await resp.json();
        this.items = data.items || [];
        this.currentFullPath = data.fullPath || '';
        this.parentPath = (data.parentPath !== undefined) ? data.parentPath : '';
        this.isDrivesRoot = !!data.isDrivesRoot;
        if (this.pathDisplay) this.pathDisplay.textContent = this.formatDisplayPath();
        if (this.upBtn) {
          if (isAdmin) {
            this.upBtn.disabled = !!this.isDrivesRoot;
          } else {
            this.upBtn.disabled = !this.currentPath;
          }
        }
        this.renderTableItems();
      } catch (err) {
        this.tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#ef4444; padding:24px;">Connection error: ' + err.message + '</td></tr>';
      }
    }

    renderTableItems() {
      this.tbody.innerHTML = '';
      if (this.items.length === 0) {
        this.tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#94a3b8; padding:32px;">This directory is empty</td></tr>';

        nameWrapper.appendChild(iconSpan);

        const nameSpan = document.createElement('span');
        nameSpan.textContent = item.name;

        if (item.isDir) {
          nameSpan.className = 'file-name-link';
          nameSpan.style.cursor = 'pointer';

          nameSpan.style.fontWeight = '500';
          nameSpan.addEventListener('click', () => {

              this.loadDirectory(nextPath, 'server');

              nextPath = base + item.name;
              this.loadDirectory(nextPath, 'server');
            } else {
              nextPath = this.currentPath ? this.currentPath + '/' + item.name : item.name;
              this.loadDirectory(nextPath, this.currentScope);

          });
        }
        nameWrapper.appendChild(nameSpan);
        tdName.appendChild(nameWrapper);

        const tdSize = document.createElement('td');
        tdSize.style.fontFamily = 'monospace';
        tdSize.style.color = '#94a3b8';
        tdSize.textContent = item.isDir ? '—' : this.formatSize(item.size);

        const tdMod = document.createElement('td');
        tdMod.style.fontFamily = 'monospace';
        tdMod.style.color = '#94a3b8';
        tdMod.textContent = this.formatDate(item.modified);

        const tdAct = document.createElement('td');
        tdAct.style.textAlign = 'center';
        tdAct.style.whiteSpace = 'nowrap';

        const canDownload = sessionStorage.getItem('gtermbox_download') !== 'false';
        const canUpload = sessionStorage.getItem('gtermbox_upload') !== 'false';

        if (!item.isDir && canDownload) {
          const dlBtn = document.createElement('button');
          dlBtn.className = 'file-action-btn file-action-download';
          dlBtn.title = 'Download ' + item.name;
          dlBtn.textContent = '📥';
          dlBtn.addEventListener('click', () => this.downloadFile(item.name));
          tdAct.appendChild(dlBtn);

        if (!item.isDir && canDownload && canUpload) {
          const cpBtn = document.createElement('button');
          cpBtn.className = 'file-action-btn file-action-copy';
          cpBtn.title = 'Copy ' + item.name;
          cpBtn.textContent = '📋';
          cpBtn.addEventListener('click', () => this.copyFilePrompt(item.name));
          tdAct.appendChild(cpBtn);
        }

        if (canUpload) {
          const delBtn = document.createElement('button');
          delBtn.className = 'file-action-btn file-action-delete';
          delBtn.title = 'Delete ' + item.name;
          delBtn.textContent = '🗑';
          delBtn.addEventListener('click', () => this.deleteItem(item.name, item.isDir));
          tdAct.appendChild(delBtn);
        }

        tr.appendChild(tdName);
        tr.appendChild(tdSize);
        tr.appendChild(tdMod);
        tr.appendChild(tdAct);
        this.tbody.appendChild(tr);
      });
    }

    goUp() {
      const isAdmin = sessionStorage.getItem('gtermbox_role') === 'admin';
      if (isAdmin) {
        if (this.isDrivesRoot) return;
        if (this.parentPath && this.parentPath !== '') {
          if (this.parentPath === 'drives') {
            this.loadDirectory('drives', 'drives');
          } else {
            this.loadDirectory(this.parentPath, 'server');
          }
        } else {
          this.loadDirectory('drives', 'drives');
        }
        return;
      }
      if (this.currentScope === 'home') {
        if (!this.currentPath) return;
        const parts = this.currentPath.split('/');
        parts.pop();
        this.loadDirectory(parts.join('/'), 'home');
      } else if (this.currentScope === 'server') {
        if (!this.currentPath) return;
        const parts = this.currentPath.split('/');
        parts.pop();
        this.loadDirectory(parts.join('/'), 'server');
      }
    }

    async copyFilePrompt(filename) {
      const destName = prompt(`Copy "${filename}" to (filename or path/filename):`, filename);
      if (!destName || destName.trim() === '') return;
      const token = sessionStorage.getItem('gtermbox_token') || '';
      try {
        let toPath = this.currentPath || '';
        let toName = destName.trim().replace(/\\+/g, '/');
        const lastSlash = toName.lastIndexOf('/');
        if (lastSlash >= 0) {
          const sub = toName.substring(0, lastSlash);
          toPath = toPath ? toPath + '/' + sub : sub;
          toName = toName.substring(lastSlash + 1);
        }
        const resp = await fetch('/api/sandbox/copy', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            fromScope: this.currentScope,
            fromPath: this.currentPath || '',
            fromName: filename,
            toScope: this.currentScope,
            toPath: toPath,
            toName: toName
          })
        });
        if (resp.ok) {
          showToast(`Copied ${filename} to ${toName}`, 'success');
          this.loadDirectory(this.currentPath, this.currentScope);
        } else {
          const errObj = await resp.json().catch(() => ({}));
          showToast('Failed to copy: ' + (errObj.error || resp.statusText), 'error');
        }
      } catch (err) {
        showToast('Copy error: ' + err.message, 'error');
      }
    }

    async downloadFile(filename) {
      if (sessionStorage.getItem('gtermbox_download') === 'false') {
        showToast('Download permission denied for your account', 'error');
        return;
      }
      const token = sessionStorage.getItem('gtermbox_token') || '';
      try {
        let url = `/api/sandbox/file?name=${encodeURIComponent(filename)}&scope=${encodeURIComponent(this.currentScope)}`;
        if (this.currentPath) {
          url += `&path=${encodeURIComponent(this.currentPath)}`;
        }
        const resp = await fetch(url, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!resp.ok) {
          showToast('Download failed: ' + resp.statusText, 'error');
          return;
        }
        const blob = await resp.blob();
        const dlUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = dlUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(dlUrl);
        showToast('Downloaded ' + filename, 'success');
      } catch (err) {
        showToast('Download error: ' + err.message, 'error');
      }
    }

      };
      downloadForm.addEventListener('submit', function(e) {

    async deleteItem(name, isDir) {

      if (!confirm(`Are you sure you want to delete ${typeLabel} "${name}"?`)) {

      }
      const token = sessionStorage.getItem('gtermbox_token') || '';
      try {
        let url = `/api/sandbox/file?name=${encodeURIComponent(name)}&scope=${encodeURIComponent(this.currentScope)}`;
        if (this.currentPath) {
          url += `&path=${encodeURIComponent(this.currentPath)}`;
        }
        const resp = await fetch(url, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (resp.ok) {

          this.loadDirectory(this.currentPath, this.currentScope);
        } else {
          const errObj = await resp.json().catch(() => ({}));

        }
      } catch (err) {
        showToast('Delete error: ' + err.message, 'error');
      }
    }

    async handleUploadFiles(files) {
      if (!files || files.length === 0) return;

      if (!token) {
        showToast('Please sign in to upload files to sandbox', 'error');

      for (let i = 0; i < files.length; i++) {

class TabManager {
    constructor(tabsBarEl, containerWrapperEl) {
      this.tabsBar = tabsBarEl;
      this.wrapper = containerWrapperEl;
      this.tabs = [];
      this.activeTabId = null;
      this.counter = 0;
    }

    createTab(appName) {
      const appInfo = (window.serverApps || []).find(a => a.id === appName);
      if (appInfo && appInfo.available === false) {
        showToast(`Application "${appInfo.name || appName}" is not available on this server.`, 'warning');
        return null;
      }

      this.counter++;
      const tabId = 'tab-' + this.counter;
      const isFiles = appName === 'files';
      const pane = document.createElement('div');
      pane.id = 'pane-' + tabId;
      pane.className = isFiles ? 'tab-pane files-pane' : 'tab-pane';
      this.wrapper.appendChild(pane);

      const tabEl = document.createElement('div');
      tabEl.id = tabId;
      tabEl.className = isFiles ? 'tab files-tab' : 'tab';
      const titleSpan = document.createElement('span');
      const displayName = isFiles ? (appInfo && appInfo.name ? appInfo.name : 'Files') : appName;
      titleSpan.textContent = `${displayName} (#${this.counter})`;
      const closeSpan = document.createElement('span');
      closeSpan.className = 'tab-close';

      closeSpan.textContent = '\u00d7';
      tabEl.appendChild(titleSpan);
      tabEl.appendChild(closeSpan);

      const newBtn = document.getElementById('new-tab-btn');
      this.tabsBar.insertBefore(tabEl, newBtn);

      let instance;
      if (isFiles) {
        instance = new FileManagerPanel(pane);
      } else {
        instance = new GTermBox(pane, appName);
        instance.onLaunchFailed = (err) => {
          this.closeTab(tabId);
          if (this.tabs.length === 0) {
            const fallback = (window.serverApps || []).find(a => a.available !== false && a.id !== appName);
            if (fallback) {
              this.createTab(fallback.id);
            }
          }
        };
      }
      const tabObj = {
        id: tabId,
        type: isFiles ? 'files' : 'terminal',
        app: appName,
        paneEl: pane,
        tabEl: tabEl,
        instance: instance
      };

      tabEl.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-close')) return;
        this.setActiveTab(tabId);
      });

      tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
        e.stopPropagation();
        this.closeTab(tabId);
      });

      this.tabs.push(tabObj);
      this.setActiveTab(tabId);
      if (isFiles) {
        instance.loadDirectory('');
      }
      return tabObj;
    }

    createFilesTab() {
      const existing = this.tabs.find(t => t.type === 'files');
      if (existing) {
        this.setActiveTab(existing.id);
        existing.instance.loadDirectory(existing.instance.currentPath || '');
        return existing;
      }

      this.counter++;
      const tabId = 'tab-files-' + this.counter;
      const pane = document.createElement('div');
      pane.id = 'pane-' + tabId;
      pane.className = 'tab-pane files-pane';
      this.wrapper.appendChild(pane);

      const tabEl = document.createElement('div');
      tabEl.id = tabId;
      tabEl.className = 'tab files-tab';
      const titleSpan = document.createElement('span');
      titleSpan.textContent = '📁 Files';
      const closeSpan = document.createElement('span');
      closeSpan.className = 'tab-close';
      closeSpan.title = 'Close tab';
      closeSpan.textContent = '\u00d7';
      tabEl.appendChild(titleSpan);
      tabEl.appendChild(closeSpan);

      const newBtn = document.getElementById('new-tab-btn');
      this.tabsBar.insertBefore(tabEl, newBtn);

      const fileManager = new FileManagerPanel(pane);
      const tabObj = {
        id: tabId,
        type: 'files',
        paneEl: pane,
        tabEl: tabEl,
        instance: fileManager
      };

      tabEl.addEventListener('click', (e) => {
        if (e.target.classList.contains('tab-close')) return;
        this.setActiveTab(tabId);
      });

      tabEl.querySelector('.tab-close').addEventListener('click', (e) => {
        e.stopPropagation();
        this.closeTab(tabId);
      });

      this.tabs.push(tabObj);
      this.setActiveTab(tabId);
      fileManager.loadDirectory('');
      return tabObj;
    }

    setActiveTab(tabId) {
      const target = this.tabs.find(t => t.id === tabId);
      if (!target) return;
      this.activeTabId = tabId;

      this.tabs.forEach(t => {
        if (t.id === tabId) {
          t.tabEl.classList.add('active');
          t.paneEl.classList.add('active');
          if (t.type === 'files') {
            const appSelector = document.getElementById('appSelector');
            if (appSelector) {
              appSelector.value = 'files';
            }
            const badge = document.getElementById('transport-badge');
            if (badge) {
              badge.textContent = 'Sandbox Files';
              badge.style.background = '#0284c7';
            }
          } else {
            try {
              t.instance.fitAddon.fit();
              t.instance.term.focus();
            } catch (_) {}
            const appSelector = document.getElementById('appSelector');
            if (appSelector) {
              appSelector.value = t.app;
            }
            const badge = document.getElementById('transport-badge');
            if (badge) {
              if (t.instance && t.instance.isDestroyed) {
                badge.textContent = 'Disconnected';
                badge.style.background = '#64748b';
              } else if (t.instance && t.instance.transportMode === 'webtransport') {
                badge.textContent = 'WebTransport';
                badge.style.background = '#10b981';
              }
            }
          }
        } else {
          t.tabEl.classList.remove('active');
          t.paneEl.classList.remove('active');
        }
      });
    }

    closeTab(tabId) {
      const idx = this.tabs.findIndex(t => t.id === tabId);
      if (idx === -1) return;
      const tab = this.tabs[idx];
      if (tab.type === 'files') {
        tab.instance.destroy();
      } else {
        try { tab.instance.send({ type: 'close' }); } catch (_) {}
        tab.instance.destroy();
      }
      tab.paneEl.remove();
      tab.tabEl.remove();
      this.tabs.splice(idx, 1);

      if (this.tabs.length === 0) {
        this.activeTabId = null;
        const badge = document.getElementById('transport-badge');
        if (badge) {
          badge.textContent = 'Disconnected';
          badge.style.background = '#64748b';
        }
      } else if (this.activeTabId === tabId) {
        const nextIdx = Math.max(0, idx - 1);
        this.setActiveTab(this.tabs[nextIdx].id);
      }
    }

    getActiveTab() {
      return this.tabs.find(t => t.id === this.activeTabId) || null;
    }

    closeAll() {
      this.tabs.forEach(t => {
        if (t.type === 'files') {
          t.instance.destroy();
        } else {
          try { t.instance.send({ type: 'close' }); } catch (_) {}
          t.instance.destroy();
        }
        t.paneEl.remove();
        t.tabEl.remove();
      });
      this.tabs = [];
      this.activeTabId = null;
    }
  }

    function parseJwt(token) {

      try {

        const base64Url = token.split('.')[1];

        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');

        const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));

        return JSON.parse(jsonPayload);

      } catch (_) {

        return null;

      }

    }



    function isTokenValid(token) {

      if (!token) return false;

      if (!payload) return false;

      if (payload.exp && (payload.exp * 1000) < Date.now()) return false;

      return true;

    }

      try {
        const mStatus = await fetch('/api/mtls/status').then(r => r.json()).catch(() => null);
        let mtlsBox = document.getElementById('mtls-login-box');
        if (mStatus && mStatus.has_client_cert && mStatus.verified) {
          if (!mtlsBox) {
            mtlsBox = document.createElement('div');
            mtlsBox.id = 'mtls-login-box';
            mtlsBox.style.cssText = 'background:rgba(16,185,129,0.12); border:1px solid #10b981; border-radius:8px; padding:12px; margin-bottom:12px; text-align:center;';
            loginForm.parentNode.insertBefore(mtlsBox, loginForm);
          }
          const clientName = (mStatus.whitelisted_user || mStatus.common_name || mStatus.subject || 'Client Certificate');
          mtlsBox.innerHTML = `
            <div style="font-size:12px; color:#a7f3d0; margin-bottom:6px;">TLS Certificate verified:</div>
            <div style="font-weight:700; color:#ffffff; font-size:15px; margin-bottom:8px;">${clientName}</div>
            <button type="button" id="mtls-enter-btn" style="width:100%; padding:9px; background:#10b981; color:#fff; border:none; border-radius:6px; font-weight:600; cursor:pointer;">Sign in with Certificate</button>
            <div style="font-size:11px; color:#6ee7b7; margin-top:8px;">Mutual TLS active. No password needed.</div>
          `;
          document.getElementById('mtls-enter-btn').onclick = () => checkMtlsAndAutoLogin();
          loginForm.style.display = 'none';
          return;
        } else if (mtlsBox) {
          mtlsBox.remove();
          loginForm.style.display = 'flex';
        }
      } catch (_) {}

      if (loginUsername) loginUsername.focus();
    }

    window.showLoginGlobal = showLogin;



    function hideLogin() {
      if (loginOverlay) {
        loginOverlay.style.display = 'none';
      }
      const user = sessionStorage.getItem('gtermbox_user') || '';
      const sandbox = sessionStorage.getItem('gtermbox_sandbox') || '';
      if (userInfo) {
        userInfo.textContent = user + ' (' + sandbox + ')';
        userInfo.style.display = 'inline-block';
      }
      if (logoutBtn) {
        logoutBtn.style.display = 'inline-block';
      }

    }



    if (logoutBtn) {

      logoutBtn.addEventListener('click', () => {

        tabManager.closeAll();

        sessionStorage.clear();

        currentApp = '';

        showLogin();

      });

    }



    if (loginForm) {

      loginForm.addEventListener('submit', async (e) => {

        e.preventDefault();

        loginError.style.display = 'none';

        const username = loginUsername.value.trim();

        const password = loginPassword.value;

        try {

          const resp = await fetch('/api/login', {

            method: 'POST',

            headers: { 'Content-Type': 'application/json' },

            body: JSON.stringify({ username, password })

          });

          if (resp.ok) {

            const data = await resp.json();

            sessionStorage.setItem('gtermbox_token', data.token);

            sessionStorage.setItem('gtermbox_user', data.username);
            sessionStorage.setItem('gtermbox_role', data.role || 'user');

            sessionStorage.setItem('gtermbox_sandbox', data.sandbox);
            sessionStorage.setItem('gtermbox_upload', data.upload !== false ? 'true' : 'false');
            sessionStorage.setItem('gtermbox_download', data.download !== false ? 'true' : 'false');

            hideLogin();

            loadApps();

          } else {

            const err = await resp.json().catch(() => ({}));

            loginError.textContent = err.error || 'Invalid username or password';

            loginError.style.display = 'block';

          }

        } catch (err) {

          loginError.textContent = 'Connection error during login';

          loginError.style.display = 'block';

        }

      });

    }



    async function checkMtlsAndAutoLogin() {
      try {
        const resp = await fetch('/api/login/mtls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        if (resp.ok) {
          const data = await resp.json();
          sessionStorage.setItem('gtermbox_token', data.token);
          sessionStorage.setItem('gtermbox_user', data.username);
          sessionStorage.setItem('gtermbox_role', data.role || 'user');
          sessionStorage.setItem('gtermbox_sandbox', data.sandbox);
          sessionStorage.setItem('gtermbox_upload', data.upload !== false ? 'true' : 'false');
          sessionStorage.setItem('gtermbox_download', data.download !== false ? 'true' : 'false');
          hideLogin();
          loadApps();
          return;
        }
      } catch (_) {}
      const activeTok = sessionStorage.getItem('gtermbox_token');
      if (!activeTok || !isTokenValid(activeTok)) {
        showLogin(currentToken ? 'Session expired. Please sign in again.' : '');
      }
    }

    const currentToken = sessionStorage.getItem('gtermbox_token');
    if (currentToken && isTokenValid(currentToken)) {
      hideLogin();
      loadApps();
    } else {
      sessionStorage.removeItem('gtermbox_token');
      sessionStorage.removeItem('gtermbox_user');
      sessionStorage.removeItem('gtermbox_sandbox');
      checkMtlsAndAutoLogin();
    }



    window.addEventListener('beforeunload', () => {

      tabManager.closeAll();

    });



    window.addEventListener('pagehide', () => {

      tabManager.closeAll();

    });

  });

})(window, document);

  </script>

</body>

</html>
